<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>MEME GENERATOR <span style="color: var(--accent-pink);">AI</span></h1>
    <p>Escribe, Drag, Drop y Comparte</p>
</header>

<div class="container">
    <section class="editor-zone">
        <canvas id="memeCanvas" width="800" height="800"></canvas>

        <div class="controls">
            <div style="margin-bottom: 10px;">
                <label style="font-size:0.9rem; color:#aaa;">Tema para la IA:</label>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <input type="text" id="memeTopic" placeholder="Ej: Programadores vs Bugs..." style="flex-grow:1;">
                    <button class="btn-ai" onclick="generateAIContent()">✨ Generar</button>
                </div>
            </div>
            
            <hr style="width: 100%; border: 0.5px solid #333; margin: 10px 0;">
            
            <div class="control-row">
                <div class="control-label">TEXTO SUPERIOR</div>
                <input type="text" id="topTextInput" placeholder="Escribe aquí..." oninput="updateText('top')">
                <input type="color" id="topColor" value="#FFFFFF" oninput="updateStyle('top')" title="Color">
                <input type="range" id="topSize" min="20" max="150" value="60" oninput="updateStyle('top')" title="Tamaño">
            </div>

            <div class="control-row">
                <div class="control-label">TEXTO INFERIOR</div>
                <input type="text" id="bottomTextInput" placeholder="Escribe aquí..." oninput="updateText('bottom')">
                <input type="color" id="bottomColor" value="#FFFFFF" oninput="updateStyle('bottom')" title="Color">
                <input type="range" id="bottomSize" min="20" max="150" value="60" oninput="updateStyle('bottom')" title="Tamaño">
            </div>
            
            <div class="btn-group">
                <button class="btn-action btn-share" onclick="shareMeme()">🔗 Compartir</button>
                <button class="btn-action btn-download" onclick="downloadMeme()">💾 Guardar</button>
            </div>
        </div>
    </section>

    <section class="gallery-zone">
        <h3 style="margin-top:0; color: var(--accent);">Plantillas Populares</h3>
        <div id="gallery" class="gallery-grid"></div>
    </section>
</div>
<script src="js/app.js"></script>

</body>
</html>
